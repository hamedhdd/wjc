[package]
name = "wjc"
version = "1.4.0"
edition = "2021"
description = "Lightweight Native Windows Jalali Calendar with System Tray Integration"

[dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winres = "0.1.12"
